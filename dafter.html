<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر التاجر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>دفتر التاجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --surface:#fff; --surface-2:#f5f7fb; --ink:#152033; --muted:#5d6b82; --line:#dde3ec;
  --accent:#1d4ed8; --accent-soft:#e3ebff; --accent-ink:#fff; --ok:#15803d; --ok-soft:#dcf3e4;
  --warn:#b45309; --warn-soft:#fdf0d9; --bad:#c2262e; --bad-soft:#fde3e4;
  --screen:#0e1524; --screen-ink:#ff4b4b; --side:#13213f; --side-ink:#c9d4ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06); --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220; --surface:#141c2e; --surface-2:#1a2438; --ink:#e6ecf7; --muted:#97a5bf; --line:#27324a;
    --accent:#5b8cff; --accent-soft:#1c2b50; --accent-ink:#fff; --ok:#4ade80; --ok-soft:#163323;
    --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1a1d;
    --screen:#05080f; --side:#0a1122; --side-ink:#b4c0d9; --shadow:0 4px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#141c2e; --surface-2:#1a2438; --ink:#e6ecf7; --muted:#97a5bf; --line:#27324a;
  --accent:#5b8cff; --accent-soft:#1c2b50; --accent-ink:#fff; --ok:#4ade80; --ok-soft:#163323;
  --warn:#fbbf24; --warn-soft:#3a2c10; --bad:#f87171; --bad-soft:#3d1a1d;
  --screen:#05080f; --side:#0a1122; --side-ink:#b4c0d9; --shadow:0 4px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.n,td.n,th.n{font-variant-numeric:tabular-nums;direction:ltr;text-align:left;unicode-bidi:plaintext}
kbd{font:600 .7rem monospace;background:rgba(127,127,127,.18);border-radius:4px;padding:1px 5px;margin-inline-start:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* layout */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 16px;color:#fff}
.brand b{display:block;font-size:1.15rem}
.brand small{opacity:.7;font-size:.78rem;display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:1.2rem}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;color:inherit;margin-bottom:2px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--accent);color:#fff}
.nav a kbd{margin-inline-start:auto;background:rgba(255,255,255,.15)}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:8px 6px}
.side-foot{padding:10px 12px;font-size:.78rem;opacity:.75}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.2);color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer;margin-top:6px}
main{padding:20px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:1.45rem}
.head .sub{color:var(--muted);font-size:.9rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:10;padding:8px;display:flex;align-items:center;gap:8px}
  .brand{padding:0 4px}.brand small,.side-foot{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav a{white-space:nowrap;margin:0;padding:7px 10px;font-size:.9rem}
  .nav a kbd,.nav hr{display:none}
  main{padding:12px}
}

/* ui */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.5em 1em;cursor:pointer;font-weight:700;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:.25em .6em;font-size:.85rem;font-weight:500}
.btn.big{padding:.75em 1.4em;font-size:1.05rem}
.btn.icon{padding:.3em .55em}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.5em .7em;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:500;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:.1em .6em;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{background:var(--surface-2);color:var(--muted);font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tfoot td{font-weight:800;background:var(--surface-2);border-bottom:0}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
.tbl input{width:90px;padding:.3em .5em;text-align:left;direction:ltr}
.tbl tr.over td{background:var(--bad-soft)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted);font-weight:700;display:block}
.kpi b{display:block;font-size:1.45rem;margin-top:2px}
.kpi>span{font-size:.82rem;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.kpis{grid-template-columns:1fr}}
.dash2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:1000px){.dash2{grid-template-columns:1fr}}
.card h2{font-size:1.05rem;margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bar.today i{background:var(--ok)}
.bar small{font-size:.68rem;color:var(--muted);white-space:nowrap}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.list-row:last-child{border-bottom:0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}

/* doc editor */
.doc{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.doc>*,.dash2>*,.doc-top>*,.doc-foot>*{min-width:0}
.doc-top{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:stretch}
.doc-fields{display:grid;grid-template-columns:150px 200px 1fr 150px;gap:10px;align-content:start}
.row{display:flex;gap:6px}.row select{flex:1}
.screen{background:var(--screen);border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;color:#9fb0cf}
.screen b{font:800 2.6rem/1.1 "Tajawal",monospace;color:var(--screen-ink);direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.screen small{font-size:.8rem}
.screen span{font-size:.85rem;color:#ffd166}
.party-info{font-size:.82rem;color:var(--muted);margin-top:4px;min-height:1.2em}
.addbar{display:flex;gap:8px;margin-bottom:10px}
.addbar #d-code{flex:1;font-size:1.05rem;padding:.6em .8em}
.addbar #d-qty{width:90px;text-align:center}
.doc .tbl-wrap{max-height:52vh}
.doc-foot{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--ink)}
.pay{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:10px}
.pay label.f{width:150px}
.rest{font-weight:800;padding:.5em .8em;border-radius:9px;background:var(--surface-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:1100px){.doc-top{grid-template-columns:1fr}.doc-fields{grid-template-columns:1fr 1fr}.doc-foot{grid-template-columns:1fr}.actions{justify-content:flex-start}}
@media (max-width:520px){.doc-fields{grid-template-columns:1fr}.screen b{font-size:2rem}}

/* phone */
.mbar{display:none}
#d-cam{display:none}
@media (hover:none){kbd{display:none}}
@media (max-width:700px){
  .doc-fields{grid-template-columns:1fr 1fr;gap:8px}
  .doc-fields label:nth-child(3){grid-column:1/-1}
  .doc-top .screen{display:none}
  .addbar{flex-wrap:wrap}.addbar #d-code{flex-basis:100%}.addbar #d-qty{flex:1}
  .lines thead{display:none}
  .lines,.lines tbody{display:block}
  .lines tr{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:4px 8px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:end}
  .lines td{display:block;border:0;padding:0;white-space:normal;min-width:0}
  .lines td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--muted);font-weight:700}
  .lines td.c-no,.lines td.c-col{display:none}
  .lines td.c-name{grid-area:1/1/2/4;font-size:1rem}
  .lines td.c-del{grid-area:1/4/2/5}
  .lines td.c-code{grid-area:2/1/3/3;font-size:.8rem}
  .lines td.c-stock{grid-area:2/3/3/5;font-size:.85rem;display:flex;gap:6px;align-items:baseline}
  .lines td.c-stock::before{display:inline!important}
  .lines td.c-colis{grid-area:3/1/4/2}.lines td.c-qty{grid-area:3/2/4/3}.lines td.c-price{grid-area:3/3/4/5}
  .lines td.c-amt{grid-area:4/1/5/3;font-size:1.05rem}.lines td.c-prf{grid-area:4/3/5/5}
  .lines td.empty{grid-column:1/-1}
  .brand b{font-size:1rem;white-space:nowrap}
  .lines input{width:100%;font-size:1rem;padding:.45em .5em}
  .doc .tbl-wrap{max-height:none;border:0}
  .doc-foot .actions .big{display:none}
  .mbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--screen);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -6px 20px rgba(0,0,0,.25)}
  .mbar b{font:800 1.6rem/1 "Tajawal",monospace;color:var(--screen-ink);direction:ltr}
  .mbar small{display:block;color:#9fb0cf;font-size:.75rem}
  main.has-bar{padding-bottom:90px}
  input,select,textarea{font-size:16px}
}
@media (max-width:700px) and (hover:none){#d-cam{display:inline-flex}}
.cam video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}

/* search suggestions, stepper, tabbar */
.search-wrap{position:relative;flex:1;display:flex}
.search-wrap #d-code{flex:1}
.sugg{position:absolute;top:calc(100% + 4px);right:0;left:0;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;max-height:min(60vh,420px);overflow-y:auto}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button.on,.sugg button:hover{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
.stepper{display:flex;gap:4px;align-items:center}
.stepper button{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:1.2rem;font-weight:800;cursor:pointer;flex:none}
.tabbar,.quick,.only-m{display:none}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}

@media (max-width:700px){
  body{font-size:15px;-webkit-tap-highlight-color:transparent}
  .side{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;justify-content:space-between}
  .side .nav{display:none}
  .side-foot{display:block;padding:0}.side-foot #save-state{display:none}.side-foot button{margin:0}
  .brand .logo{width:32px;height:32px;font-size:1rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:700;border-radius:10px;cursor:pointer}
  .tabbar span{font-size:1.3rem;line-height:1.2}
  .tabbar a.on{color:var(--accent);background:var(--accent-soft)}
  .tabbar .tab-main span{background:var(--accent);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  main.has-bar{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .mbar{bottom:calc(62px + env(safe-area-inset-bottom))!important;padding-bottom:10px!important;border-radius:14px 14px 0 0}
  .toasts{bottom:calc(150px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:none}
  .head{margin-bottom:12px}.head h1{font-size:1.25rem}.head .sub{font-size:.82rem}
  .head .tools{width:100%}
  .head .tools input,.head .tools select{flex:1;min-width:120px}
  .head .tools label.f{flex:1;min-width:130px}
  .banner{padding:8px 12px;font-size:.85rem}
  .card{padding:12px}
  .kpis{grid-template-columns:1fr 1fr!important;gap:8px}
  .kpi{padding:10px 12px}.kpi b{font-size:1.1rem}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .quick a{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-decoration:none;font-size:.78rem;font-weight:700;text-align:center}
  .quick a span{font-size:1.4rem}
  .only-m{display:block}.only-d{display:none!important}
  .btn{min-height:42px}.btn.sm{min-height:36px;padding:.3em .8em}
  .bars{height:150px;gap:3px}.bar small{font-size:.58rem}
  /* doc on phone */
  .doc-fields label:nth-child(3){order:-1;grid-column:1/-1}
  .doc-fields label:nth-child(1){display:none}
  .doc-fields label:nth-child(2){grid-column:auto}
  .doc-head{flex-wrap:nowrap;margin-bottom:8px}.doc-head .sub{display:none}.doc-head .tools{width:auto}
  .doc .addbar{scroll-margin-top:70px}
  .side-foot #theme-btn span{display:none}
  body.kb .tabbar,body.kb .mbar{display:none!important}
  body.kb main{padding-bottom:20px}
  /* card tables in two columns */
  .tbl-wrap .tbl:not(.lines) tbody tr,.tbl-wrap .tbl:not(.lines) tfoot tr{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
  .addbar .search-wrap{flex-basis:100%}
  .tbl:not(.lines) td:first-child,.tbl:not(.lines) td.wrap,.tbl:not(.lines) td:has(> .acts),.tbl:not(.lines) td[colspan],.tbl:not(.lines) td.empty{grid-column:1/-1}
  .stepper button{display:grid;place-items:center}
  .stepper input{text-align:center}
  .lines td.c-qty{grid-area:3/1/4/3}.lines td.c-colis{grid-area:3/3/4/5}.lines td.c-price{grid-area:4/1/5/2}.lines td.c-amt{grid-area:4/2/5/4;text-align:center}.lines td.c-prf{grid-area:4/4/5/5}
  .lines td.c-prf{font-size:.8rem}
  .pay label.f{width:auto;flex:1;min-width:120px}
  .actions .btn{flex:1}
  /* tables become cards */
  .tbl-wrap:has(> .tbl:not(.lines)){border:0;background:none;overflow:visible;max-height:none!important}
  .tbl:not(.lines) thead{display:none}
  .tbl:not(.lines),.tbl:not(.lines) tbody,.tbl:not(.lines) tfoot{display:block}
  .tbl:not(.lines) tr{display:block;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:6px 12px;background:var(--surface)}
  .tbl:not(.lines) tbody tr:hover{background:var(--surface)}
  .tbl:not(.lines) tfoot tr{background:var(--accent-soft);border-color:transparent}
  .tbl:not(.lines) tfoot td{background:none}
  .tbl:not(.lines) td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:4px 0;white-space:normal;min-width:0;direction:rtl;text-align:left}
  .tbl:not(.lines) td::before{content:attr(data-l);color:var(--muted);font-weight:700;font-size:.8rem;text-align:right;flex:none}
  .tbl:not(.lines) td:not([data-l])::before,.tbl:not(.lines) td[data-l=""]::before{content:none}
  .tbl:not(.lines) td:first-child{font-size:1rem;font-weight:700;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:2px}
  .tbl:not(.lines) td:empty{display:none}
  .tbl:not(.lines) td.wrap{min-width:0}
  .tbl:not(.lines) .acts{justify-content:flex-start;flex-wrap:wrap;width:100%;padding-top:4px}
  .tbl:not(.lines) td:has(> .acts){border-top:1px dashed var(--line);margin-top:4px}
  .tbl:not(.lines) td.empty{display:block}
  /* bottom-sheet dialogs */
  dialog,dialog.wide{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh}
  .m-body{max-height:calc(92vh - 58px);padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .m-foot{flex-wrap:wrap}.m-foot .btn{flex:1}
  dialog[open]{animation:sheet .22s ease}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));background:var(--surface);color:var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(900px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,15,30,.5)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size:1.15rem}
.m-body{padding:18px;max-height:75vh;overflow:auto}
.m-body form{display:grid;gap:12px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.pick-list{display:grid;gap:6px}
.pick-list button{display:flex;justify-content:space-between;gap:10px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.6em .8em;cursor:pointer}
.pick-list button:hover{border-color:var(--accent);background:var(--accent-soft)}

/* toast */
.toasts{position:fixed;bottom:16px;left:16px;z-index:1000;display:grid;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:10px;box-shadow:var(--shadow);animation:pop .2s ease;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

/* print */
#print{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff;color:#000}
  .app,.toasts,dialog{display:none!important}
  #print{display:block;font-family:Arial,"Tajawal",sans-serif;font-size:12px;color:#000}
  #print.ticket{width:72mm;font-size:11px}
  #print table{width:100%;border-collapse:collapse;margin:8px 0}
  #print th,#print td{border:1px solid #000;padding:4px 6px;text-align:start}
  #print .r{text-align:end}
  #print .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
  #print .ph h2{margin:0;font-size:18px}
  #print h1{text-align:center;font-size:17px;margin:8px 0;border:2px solid #000;padding:4px}
  #print .tot{width:48%;margin-inline-start:auto}
  #print.ticket .ph{display:block;text-align:center}
  #print.ticket .tot{width:100%}
  #print.ticket th,#print.ticket td{border:0;border-bottom:1px dashed #000;padding:2px}
  #print .sig{display:flex;justify-content:space-between;margin-top:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">📒</div><div><b>دفتر التاجر</b><small id="company-name"></small></div></div>
    <nav class="nav" id="nav">
      <a href="#/dash" data-r="dash">📊 لوحة القيادة</a>
      <hr>
      <a href="#/sale" data-r="sale">🧾 بيع جديد <kbd>F1</kbd></a>
      <a href="#/journal" data-r="journal">📒 سجل المبيعات</a>
      <a href="#/purchase" data-r="purchase">📥 شراء جديد</a>
      <a href="#/purchases" data-r="purchases">📚 سجل المشتريات</a>
      <hr>
      <a href="#/products" data-r="products">📦 المخزون</a>
      <a href="#/clients" data-r="clients">👥 الزبائن</a>
      <a href="#/suppliers" data-r="suppliers">🏭 المورّدون</a>
      <a href="#/charges" data-r="charges">💸 المصاريف</a>
      <a href="#/cash" data-r="cash">💰 الخزينة</a>
      <hr>
      <a href="#/settings" data-r="settings">⚙️ الإعدادات</a>
    </nav>
    <div class="side-foot">
      <div id="save-state">✓ محفوظ على هذا الجهاز</div>
      <button id="theme-btn" aria-label="الوضع الليلي">🌓 <span>الوضع الليلي</span></button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<dialog id="modal">
  <div class="m-head"><h3 id="m-title"></h3><button class="btn icon" id="m-close" aria-label="إغلاق">✕</button></div>
  <div class="m-body" id="m-body"></div>
</dialog>
<nav class="tabbar" id="tabbar" aria-label="التنقل">
  <a href="#/dash" data-r="dash"><span>🏠</span>الرئيسية</a>
  <a href="#/products" data-r="products"><span>📦</span>المخزون</a>
  <a href="#/sale" data-r="sale" class="tab-main"><span>🧾</span>بيع</a>
  <a href="#/clients" data-r="clients"><span>👥</span>الزبائن</a>
  <button type="button" id="tab-more"><span>☰</span>المزيد</button>
</nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print"></div>

<script>
"use strict";
/* ================= أدوات ================= */
const KEY = "dafter:v1";
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2, "0");
const pad6 = n => String(n).padStart(6, "0");
function m(n){ n = r2(n); const [i, d] = Math.abs(n).toFixed(2).split("."); return (n < 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+$)/g, "\u00A0") + "." + d; }
const DA = n => `<span class="n">${m(n)}</span>`;
const qf = n => String(r2(n));
const toLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const today = () => toLocal(new Date()).slice(0, 10);
const addDays = (ymd, k) => { const d = new Date(ymd + "T12:00"); d.setDate(d.getDate() + k); return toLocal(d).slice(0, 10); };
const fdate = s => { if (!s) return ""; const [d, t] = s.split("T"); const [y, mo, da] = d.split("-"); return `${da}/${mo}/${y}${t ? " " + t.slice(0, 5) : ""}`; };
const isTouch = matchMedia("(hover:none) and (pointer:coarse)").matches;
const MODES = { espece:"نقدًا", cheque:"شيك", virement:"تحويل", credit:"بالدَّين" };
const CHARGE_CATS = ["إيجار","كهرباء وماء","أجور","نقل ووقود","صيانة","ضرائب ورسوم","خسائر / تالف","أخرى"];

function toast(t, bad){ const el = document.createElement("div"); el.className = "toast" + (bad ? " bad" : ""); el.textContent = t; $("#toasts").appendChild(el); setTimeout(() => el.remove(), bad ? 4200 : 2600); }

/* ================= قاعدة البيانات ================= */
let storageOk = true;
let db = load();
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); } catch(e){ storageOk = false; }
  return cleanStart();
}
// بداية نظيفة: منتجات التاجر بأسعار البيع الحقيقية فقط، بدون أي أرقام تجريبية
function cleanStart(){
  const d = emptyDb(); d._rev = Date.now();
  d.families = [{id:"f1",name:"أكياس كوبتان"},{id:"f2",name:"أكياس مطبوعة"},{id:"f3",name:"أكياس بلاستيك"}];
  const P = (code, name, f, sell, col=1) => ({id:uid(), code, name, familyId:f, buy:0, sell, sellGros:0, stock:0, colisage:col, min:0});
  d.products = [
    P("1000000000702","KOBTAN NOIR PK/60 N (7)","f1",750),
    P("1000000005127","KOBTAN NOIR PK/70 N (8)","f1",840),
    P("1000000005844","KOBTAN IMPR P60","f2",980),
    P("1000000008319","Cosmetique 20/30 parfume","f2",900),
    P("1000000000986","GOLDEN BIBA GM","f3",195),
    P("1000000008258","15K Power Bag 1 Choix","f3",170,10),
    P("1000000007824","3K P70","f3",800),
    P("1000000001983","Sky GM","f3",380),
    P("1000000007374","Sac Pub Korozo","f2",500),
    P("1000000004144","KOROZO MY","f3",330),
    P("1000000000962","25K couleur 2 Choix","f3",1305),
  ];
  return d;
}
function normalize(d){
  if (d && d.settings && d.settings.demo) return cleanStart(); // استبدال البيانات التجريبية القديمة
  const base = emptyDb();
  for (const k in base) if (d[k] === undefined) d[k] = base[k];
  d.settings = Object.assign(base.settings, d.settings);
  d.drafts = d.drafts || {};
  return d;
}
function emptyDb(){
  return {
    settings:{ name:"مؤسستي للتغليف", activity:"بيع مواد التغليف بالجملة والتجزئة", address:"", phone:"", rc:"", nif:"", ai:"",
      currency:"DA", nextBL:1, nextBR:1, openingCash:0, allowNegative:true, printFormat:"a4", printLang:"fr", showProfit:true, demo:false, lastBackup:null },
    families:[], products:[], clients:[], suppliers:[], sales:[], purchases:[], payments:[], charges:[], held:[], drafts:{}
  };
}
let saveTimer;
function save(){
  db._rev = Date.now(); cloudSchedule();
  try { localStorage.setItem(KEY, JSON.stringify(db)); if (!cloud.ready) $("#save-state").textContent = "✓ محفوظ على هذا الجهاز"; }
  catch(e){ storageOk = false; $("#save-state").textContent = "⚠ تعذّر الحفظ"; toast("تعذّر الحفظ في المتصفح! صدّر نسخة احتياطية من الإعدادات فورًا.", true); }
}
const prod = id => db.products.find(p => p.id === id);
const partyColl = kind => kind === "client" ? db.clients : db.suppliers;
const party = (kind, id) => partyColl(kind).find(p => p.id === id);
function applyStock(lines, sign){ for (const l of lines){ const p = prod(l.pid); if (p) p.stock = r2(p.stock + sign * l.qty); } }
function docTotals(d){
  const sub = r2(d.lines.reduce((s, l) => s + l.qty * l.price, 0));
  const remise = Math.min(Math.max(0, num(d.remise)), sub);
  const total = r2(sub - remise);
  const cost = d.lines.reduce((s, l) => s + l.qty * (l.buy || 0), 0);
  return { sub, remise, total, profit:r2(total - cost), qty:r2(d.lines.reduce((s, l) => s + l.qty, 0)), count:d.lines.length };
}
const docProfit = s => r2(s.total - s.lines.reduce((a, l) => a + l.qty * (l.buy || 0), 0));
// الرصيد: موجب = الزبون مدين لنا / نحن مدينون للمورّد
function balance(kind, id, upto, excludeDocId){
  const p = party(kind, id); if (!p) return 0;
  let b = num(p.opening);
  for (const d of (kind === "client" ? db.sales : db.purchases))
    if (d.partyId === id && d.id !== excludeDocId && (!upto || d.date <= upto)) b += d.total - d.paid;
  for (const x of db.payments)
    if (x.kind === kind && x.partyId === id && (!upto || x.date <= upto)) b -= x.amount;
  return r2(b);
}

/* ================= التوجيه ================= */
const view = $("#view");
const curRoute = () => (location.hash.slice(2) || "dash").split("?")[0];
const routes = {
  dash:viewDash, sale:el => viewDoc("sale", el), purchase:el => viewDoc("purchase", el),
  journal:el => viewJournal("sale", el), purchases:el => viewJournal("purchase", el),
  products:viewProducts, clients:el => viewParties("client", el), suppliers:el => viewParties("supplier", el),
  charges:viewCharges, cash:viewCash, settings:viewSettings
};
function route(){
  const r = routes[curRoute()] ? curRoute() : "dash";
  $$("#nav a, #tabbar a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  $("#company-name").textContent = db.settings.name;
  view.classList.remove("has-bar");
  view.innerHTML = demoBanner();
  const holder = document.createElement("div"); view.appendChild(holder);
  routes[r](holder);
  const b = $("#demo-clear"); if (b) b.onclick = clearDemo;
}
window.addEventListener("hashchange", route);
function demoBanner(){
  return db.settings.demo ? `<div class="banner"><span>👋 هذه <b>بيانات تجريبية</b> لتجربة البرنامج. عندما تكون جاهزًا امسحها وابدأ ببياناتك.</span><button class="btn sm" id="demo-clear">مسح البيانات التجريبية</button></div>` : "";
}
function clearDemo(){
  modal("مسح البيانات التجريبية", `<form id="f">
    <p>سيتم حذف المبيعات والمشتريات والزبائن والمورّدين والمصاريف التجريبية.</p>
    <label><input type="checkbox" name="keep" checked> الإبقاء على قائمة المنتجات (مع تصفير المخزون)</label>
    <div class="m-foot"><button class="btn danger" type="submit">مسح والبدء</button></div></form>`, b => {
    $("#f", b).onsubmit = e => { e.preventDefault();
      const keep = e.target.keep.checked, fresh = emptyDb();
      fresh.settings = Object.assign(db.settings, {demo:false, nextBL:1, nextBR:1});
      if (keep){ fresh.families = db.families; fresh.products = db.products.map(p => ({...p, stock:0})); }
      db = fresh; save(); closeModal(); toast("تم المسح. ابدأ بإضافة زبائنك ومنتجاتك."); route(); };
  });
}

/* ================= نافذة منبثقة ================= */
const dlg = $("#modal");
function modal(title, body, onOpen, wide){
  $("#m-title").textContent = title; $("#m-body").innerHTML = body;
  dlg.classList.toggle("wide", !!wide);
  if (!dlg.open) dlg.showModal();
  onOpen && onOpen($("#m-body"));
  const first = $("#m-body input:not([type=hidden]):not([type=checkbox]):not([readonly]), #m-body select"); first && !isTouch && first.focus();
}
function closeModal(){ if (dlg.open) dlg.close(); }
$("#m-close").onclick = closeModal;
dlg.addEventListener("click", e => { if (e.target === dlg) closeModal(); });

/* ================= لوحة القيادة ================= */
function viewDash(el){
  const t = today(), month = t.slice(0, 7);
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const sToday = db.sales.filter(s => s.date.startsWith(t)), sMonth = db.sales.filter(s => s.date.startsWith(month));
  const chMonth = sum(db.charges.filter(c => c.date.startsWith(month)), c => c.amount);
  const clientDebt = sum(db.clients, c => Math.max(0, balance("client", c.id)));
  const suppDebt = sum(db.suppliers, c => Math.max(0, balance("supplier", c.id)));
  const stockVal = sum(db.products, p => Math.max(0, p.stock) * p.buy);
  const low = db.products.filter(p => p.stock <= p.min).sort((a, b) => a.stock - b.stock);
  const days = [...Array(14)].map((_, i) => addDays(t, i - 13));
  const perDay = days.map(d => sum(db.sales.filter(s => s.date.startsWith(d)), s => s.total));
  const max = Math.max(1, ...perDay);
  const top = {}; sMonth.forEach(s => s.lines.forEach(l => { top[l.name] = (top[l.name] || 0) + l.qty * l.price; }));
  const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const debtors = db.clients.map(c => [c, balance("client", c.id)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const noBuy = db.products.filter(p => !(p.buy > 0)).length;
  const setup = !db.sales.length ? `<div class="card" style="margin-bottom:14px"><h2>👋 ابدأ في 3 خطوات</h2>
    <div class="list-row"><span>1. اكتب اسم مؤسستك ومعلوماتها</span><a class="btn sm" href="#/settings">الإعدادات</a></div>
    <div class="list-row"><span>2. أدخل سعر الشراء والكمية لكل منتج (زر «تعديل»)</span><a class="btn sm" href="#/products">المخزون</a></div>
    <div class="list-row"><span>3. أضف زبائنك وديونهم القديمة</span><a class="btn sm" href="#/clients">الزبائن</a></div></div>` : "";
  const firstSale = db.sales.reduce((a, x) => !a || x.date < a ? x.date : a, "");
  const backupOld = !cloud.ready && firstSale && (db.settings.lastBackup ? Date.now() - db.settings.lastBackup > 7 * 864e5 : firstSale.slice(0, 10) <= addDays(today(), -7));
  el.innerHTML = `
  <div class="head"><div><h1>لوحة القيادة</h1><div class="sub">${fdate(t)} — ${esc(db.settings.name)}</div></div>
    <div class="tools only-d"><a class="btn primary big" href="#/sale">🧾 بيع جديد <kbd>F1</kbd></a></div></div>
  ${setup}
  ${noBuy ? `<div class="banner"><span>⚠ ${noBuy} منتج بدون سعر شراء، لذلك الأرباح غير دقيقة.</span><a class="btn sm" href="#/products">إكمال الأسعار</a></div>` : ""}
  ${backupOld ? `<div class="banner"><span>💾 لم تحفظ نسخة احتياطية منذ أكثر من أسبوع. بياناتك موجودة في هذا المتصفح فقط.</span><a class="btn sm" href="#/settings">نسخة احتياطية الآن</a></div>` : ""}
  <div class="quick">
    <a href="#/journal"><span>📒</span>سجل المبيعات</a><a href="#/purchase"><span>📥</span>شراء</a>
    <a href="#/cash"><span>💰</span>الخزينة</a><a href="#/charges"><span>💸</span>مصروف</a>
  </div>
  <div class="kpis">
    <div class="card kpi"><small>مبيعات اليوم</small><b>${DA(sum(sToday, s => s.total))}</b><span>${sToday.length} وصل</span></div>
    <div class="card kpi"><small>ربح اليوم</small><b class="pos">${DA(sum(sToday, docProfit))}</b><span>قبل المصاريف</span></div>
    <div class="card kpi"><small>مبيعات الشهر</small><b>${DA(sum(sMonth, s => s.total))}</b><span>${sMonth.length} وصل</span></div>
    <div class="card kpi"><small>صافي ربح الشهر</small><b class="${sum(sMonth, docProfit) - chMonth >= 0 ? "pos" : "neg"}">${DA(sum(sMonth, docProfit) - chMonth)}</b><span>بعد مصاريف ${m(chMonth)}</span></div>
    <div class="card kpi"><small>ديون الزبائن (لنا)</small><b class="neg">${DA(clientDebt)}</b><span><a href="#/clients">عرض الزبائن</a></span></div>
    <div class="card kpi"><small>ديون المورّدين (علينا)</small><b>${DA(suppDebt)}</b><span><a href="#/suppliers">عرض المورّدين</a></span></div>
    <div class="card kpi"><small>قيمة المخزون (بسعر الشراء)</small><b>${DA(stockVal)}</b><span>${db.products.length} منتج</span></div>
    <div class="card kpi"><small>الصندوق</small><b>${DA(cashBalance())}</b><span><a href="#/cash">تفاصيل الخزينة</a></span></div>
  </div>
  <div class="dash2">
    <div class="card"><h2>المبيعات — آخر 14 يومًا</h2>
      <div class="bars" role="img" aria-label="مخطط المبيعات اليومية">${days.map((d, i) => `<div class="bar ${d === t ? "today" : ""}" title="${fdate(d)}: ${m(perDay[i])}"><i style="height:${perDay[i] / max * 100}%"></i><small>${d.slice(8)}/${d.slice(5, 7)}</small></div>`).join("")}</div>
    </div>
    <div class="card"><h2>⚠ منتجات قاربت على النفاد (${low.length})</h2>
      ${low.length ? low.slice(0, 7).map(p => `<div class="list-row"><span>${esc(p.name)}</span><span class="pill ${p.stock <= 0 ? "bad" : "warn"} n">${qf(p.stock)}</span></div>`).join("") : `<div class="empty">المخزون بخير ✓</div>`}
    </div>
  </div>
  <div class="dash2">
    <div class="card"><h2>الأكثر مبيعًا هذا الشهر</h2>
      ${topList.length ? topList.map(([n, v]) => `<div class="list-row"><span>${esc(n)}</span>${DA(v)}</div>`).join("") : `<div class="empty">لا مبيعات هذا الشهر بعد</div>`}
    </div>
    <div class="card"><h2>أكبر المدينين</h2>
      ${debtors.length ? debtors.map(([c, b]) => `<div class="list-row"><span>${esc(c.name)}</span><b class="neg">${DA(b)}</b></div>`).join("") : `<div class="empty">لا ديون ✓</div>`}
    </div>
  </div>`;
}

/* ================= محرر الوصولات (بيع / شراء) ================= */
const DOC = {
  sale:{coll:"sales", title:"وصل تسليم — بيع", kind:"client", numKey:"nextBL", prefix:"BL",
    priceOf:(p, pt) => pt && pt.type === "gros" && p.sellGros ? p.sellGros : p.sell},
  purchase:{coll:"purchases", title:"وصل استلام — شراء", kind:"supplier", numKey:"nextBR", prefix:"BR", priceOf:p => p.buy}
};
const blank = type => ({type, editingId:null, date:toLocal(new Date()), partyId:"", mode:"espece", lines:[], remise:"", paid:"", note:""});
const draft = type => db.drafts[type] || (db.drafts[type] = blank(type));
const resolvePaid = (d, t) => (d.paid === "" || d.paid == null) ? ((d.mode === "credit" && d.partyId) ? 0 : t.total) : Math.max(0, num(d.paid));
let draftTimer; const saveDraft = () => { clearTimeout(draftTimer); draftTimer = setTimeout(save, 400); };

function viewDoc(type, el){
  const C = DOC[type], d = draft(type), parties = partyColl(C.kind), isSale = type === "sale";
  const editRec = d.editingId && db[C.coll].find(x => x.id === d.editingId);
  el.innerHTML = `
  <div class="head doc-head"><div><h1>${editRec ? "✏️ تعديل " : ""}${C.title}</h1>

      if (sIdx >= 0 && sItems[sIdx]){ addLine(sItems[sIdx], num($("#d-qty").value) || 1); resetAdd(); } else { hideSugg(); addFromInput(); } }

function newDoc(type){
  const d = draft(type);
  if (d.lines.length && !confirm("الوصل الحالي غير محفوظ. هل تريد تركه وبدء وصل جديد؟")) return;
  db.drafts[type] = blank(type); save(); route();
}
function holdDoc(){
  const d = draft("sale");
  if (!d.lines.length) return toast("لا يوجد شيء لتعليقه");
  if (d.editingId) return toast("لا يمكن تعليق وصل قيد التعديل", true);
  db.held.push({...d, heldAt:toLocal(new Date())}); db.drafts.sale = blank("sale"); save();
  toast("⏸ تم تعليق الوصل. تجده في «المعلّقة»."); route();
}
function showHeld(){
  if (!db.held.length) return toast("لا توجد وصولات معلّقة");
  modal("الوصولات المعلّقة", `<div class="pick-list">${db.held.map((h, i) => { const pt = party("client", h.partyId); return `<button data-h="${i}"><span><b>${pt ? esc(pt.name) : "بيع بالكونتوار"}</b><br><small class="muted">${fdate(h.heldAt)} · ${h.lines.length} منتج</small></span><span class="n"><b>${m(docTotals(h).total)}</b></span></button>`; }).join("")}</div>`, b => {
    $$("[data-h]", b).forEach(btn => btn.onclick = () => {
      const cur = draft("sale"), h = db.held.splice(+btn.dataset.h, 1)[0];
      if (cur.lines.length && !cur.editingId) db.held.push({...cur, heldAt:toLocal(new Date())});
      delete h.heldAt; db.drafts.sale = h; save(); closeModal(); route();
    });
  });
}
function commitDoc(type){
  const C = DOC[type], d = draft(type), isSale = type === "sale";
  if (!d.lines.length) return toast("الوصل فارغ", true);
  if (d.lines.some(l => !(l.qty > 0))) return toast("توجد كمية غير صحيحة (0 أو فارغة)", true);
  if (!isSale && !d.partyId) return toast("اختر المورّد أولًا (F9)", true);
  const t = docTotals(d), paid = Math.min(resolvePaid(d, t), t.total);
  if (!d.partyId && paid < t.total) return toast("البيع بالكونتوار يُدفع كاملًا. اختر زبونًا للبيع بالدَّين.", true);
  const coll = db[C.coll], old = d.editingId && coll.find(x => x.id === d.editingId);
  if (isSale && !db.settings.allowNegative){
    const bad = d.lines.find(l => { const p = prod(l.pid); const back = old ? old.lines.filter(x => x.pid === l.pid).reduce((s, x) => s + x.qty, 0) : 0; return p && l.qty > p.stock + back; });
    if (bad) return toast(`المخزون غير كافٍ: ${bad.name}`, true);
  }
  if (!old && !d.dateTouched) d.date = toLocal(new Date());
  const sign = isSale ? -1 : 1;
  if (old) applyStock(old.lines, -sign);
  applyStock(d.lines, sign);
  if (!isSale) d.lines.forEach(l => { const p = prod(l.pid); if (p && l.price > 0) p.buy = l.price; });
  const rec = {id:old ? old.id : uid(), no:old ? old.no : db.settings[C.numKey]++, date:d.date, partyId:d.partyId, mode:paid < t.total ? (d.mode === "espece" ? "credit" : d.mode) : d.mode,
    lines:d.lines.map(l => ({...l})), sub:t.sub, remise:t.remise, total:t.total, paid:r2(paid), note:(d.note || "").trim()};
  if (!isSale) rec.lines.forEach(l => l.buy = l.price);
  if (old) coll[coll.indexOf(old)] = rec; else coll.push(rec);
  db.drafts[type] = blank(type); save(); route();
  modal(`✓ تم حفظ الوصل رقم ${pad6(rec.no)}`, `<p style="font-size:1.1rem">الإجمالي: <b class="n">${m(rec.total)}</b> — المدفوع: <b class="n">${m(rec.paid)}</b>${rec.total > rec.paid ? ` — الباقي دَين: <b class="neg n">${m(rec.total - rec.paid)}</b>` : ""}</p>
    <div class="m-foot">${type === "sale" ? `<button class="btn wa" id="pw">📲 واتساب</button>` : ""}<button class="btn" id="pt">🧾 تذكرة</button><button class="btn primary" id="pa">🖨 A4</button><button class="btn ok" id="pn">وصل جديد ⏎</button></div>`, b => {
    const w = $("#pw", b); w && (w.onclick = () => sendWhatsApp(type, rec));
    $("#pa", b).onclick = () => { closeModal(); printDoc(type, rec, "a4"); };
    $("#pt", b).onclick = () => { closeModal(); printDoc(type, rec, "ticket"); };
    $("#pn", b).onclick = () => { closeModal(); !isTouch && $("#d-code") && $("#d-code").focus(); };
    $("#pn", b).focus();
  });
}
function editDoc(type, id){
  const C = DOC[type], rec = db[C.coll].find(x => x.id === id), d = draft(type);
  if (d.lines.length && !confirm("يوجد وصل غير محفوظ في الشاشة. هل تريد استبداله؟")) return;
  db.drafts[type] = {type, editingId:rec.id, date:rec.date, partyId:rec.partyId, mode:rec.mode, lines:rec.lines.map(l => ({...l})), remise:rec.remise ? String(rec.remise) : "", paid:String(rec.paid), note:rec.note || ""};
  save(); location.hash = "#/" + type;
}
function deleteDoc(type, id){
  const C = DOC[type], coll = db[C.coll], rec = coll.find(x => x.id === id);
  if (!confirm(`حذف الوصل رقم ${pad6(rec.no)}؟ سيتم إرجاع الكميات إلى المخزون.`)) return;
  applyStock(rec.lines, type === "sale" ? 1 : -1);
  coll.splice(coll.indexOf(rec), 1);
  if (db.drafts[type] && db.drafts[type].editingId === id) db.drafts[type] = blank(type);
  save(); toast("تم حذف الوصل"); route();
}

/* ================= مسح الباركود بالكاميرا ================= */
async function scanBarcode(onCode){
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices){
    return toast("هذا المتصفح لا يدعم المسح بالكاميرا. استعمل Chrome على أندرويد، أو اكتب الكود يدويًا.", true);
  }
  let stream, timer, done = false;

    };
    loop();
  } catch(e){

function importProducts(text){
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return toast("الملف فارغ", true);
  const sep = [";", "\t", ","].find(s => lines[0].includes(s)) || ";";
  const split = l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, ""));
  let head = split(lines[0]).map(h => h.toLowerCase()), start = 1;
  const find = (...keys) => head.findIndex(h => keys.some(k => h.includes(k)));
  let ix = {code:find("code","barre","كود"), name:find("désign","design","nom","name","libell","اسم","منتج"), buy:find("achat","buy","شراء"), sell:find("vente","sell","prix v","تجزئة","بيع"), gros:find("gros","جملة"), stock:find("stock","qt","quant","مخزون","كمية"), col:find("colis","تعبئة")};
  if (ix.code < 0 && ix.name < 0){ ix = {code:0, name:1, buy:2, sell:3, gros:4, stock:5, col:6}; start = 0; }
  let added = 0, updated = 0;
  for (const l of lines.slice(start)){
    const c = split(l), g = i => i >= 0 ? c[i] : "";
    const name = g(ix.name); if (!name) continue;
    const code = g(ix.code) || nextCode();
    const data = {name, buy:num(g(ix.buy)), sell:num(g(ix.sell)), sellGros:num(g(ix.gros)), stock:num(g(ix.stock)), colisage:Math.max(1, num(g(ix.col)) || 1)};
    const ex = db.products.find(p => p.code === code);
    if (ex){ Object.assign(ex, data); updated++; } else { db.products.push({id:uid(), code, familyId:"", min:5, ...data}); added++; }
  }
  save(); toast(`✓ أضيف ${added} منتج، وحُدّث ${updated}`);
}

function statementRows(kind, id){
  const p = party(kind, id), isC = kind === "client", rows = [];

    rows.push({date:d.date, label:`${isC ? "BL" : "BR"}-${pad6(d.no)}`, debit:d.total, credit:0});
    if (d.paid) rows.push({date:d.date, label:`دفع مع الوصل ${pad6(d.no)}`, debit:0, credit:d.paid});
  }
  for (const x of db.payments) if (x.kind === kind && x.partyId === id) rows.push({date:x.date, label:`دفعة${x.note ? " — " + x.note : ""}`, debit:0, credit:x.amount, payId:x.id});
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let bal = num(p.opening); rows.forEach(r => { bal = r2(bal + r.debit - r.credit); r.bal = bal; });
  return rows;
}

/* ================= الخزينة ================= */
function cashMoves(){
  const mv = [];
  db.sales.forEach(s => s.paid && mv.push({date:s.date, label:`بيع BL-${pad6(s.no)}`, party:(party("client", s.partyId) || {}).name || "كونتوار", inn:s.paid, out:0}));
  db.purchases.forEach(s => s.paid && mv.push({date:s.date, label:`شراء BR-${pad6(s.no)}`, party:(party("supplier", s.partyId) || {}).name || "", inn:0, out:s.paid}));
  db.payments.forEach(x => mv.push({date:x.date, label:x.kind === "client" ? "دفعة زبون" : "دفعة لمورّد", party:(party(x.kind, x.partyId) || {}).name || "", inn:x.kind === "client" ? x.amount : 0, out:x.kind === "supplier" ? x.amount : 0}));
  db.charges.forEach(c => mv.push({date:c.date, label:`مصروف: ${c.label}`, party:c.category, inn:0, out:c.amount}));
  return mv.sort((a, b) => a.date < b.date ? -1 : 1);
}
const cashBalance = () => r2(num(db.settings.openingCash) + cashMoves().reduce((s, x) => s + x.inn - x.out, 0));
const cState = {from:null, to:null};
function viewCash(el){
  cState.from = cState.from || today().slice(0, 8) + "01"; cState.to = cState.to || today();
  const all = cashMoves();
  const before = r2(num(db.settings.openingCash) + all.filter(x => x.date.slice(0, 10) < cState.from).reduce((s, x) => s + x.inn - x.out, 0));
  const rows = all.filter(x => x.date.slice(0, 10) >= cState.from && x.date.slice(0, 10) <= cState.to);
  const inn = rows.reduce((s, x) => s + x.inn, 0), out = rows.reduce((s, x) => s + x.out, 0);
  let run = before;
  el.innerHTML = `
  <div class="head"><div><h1>الخزينة (الصندوق)</h1><div class="sub">الرصيد الحالي للصندوق: <b class="n">${m(cashBalance())}</b> ${db.settings.currency}</div></div>
    <div class="tools"><label class="f">من<input type="date" id="k-from" value="${cState.from}"></label><label class="f">إلى<input type="date" id="k-to" value="${cState.to}"></label></div></div>
  <div class="kpis">
    <div class="card kpi"><small>رصيد بداية الفترة</small><b>${DA(before)}</b></div>
    <div class="card kpi"><small>المداخيل</small><b class="pos">${DA(inn)}</b></div>
    <div class="card kpi"><small>المصاريف والمدفوعات</small><b class="neg">${DA(out)}</b></div>
    <div class="card kpi"><small>رصيد نهاية الفترة</small><b>${DA(before + inn - out)}</b></div>
  </div>
  <div class="tbl-wrap">${rows.length ? `<table class="tbl"><thead><tr><th>التاريخ</th><th>العملية</th><th>الطرف</th><th class="n">دخول</th><th class="n">خروج</th><th class="n">الرصيد</th></tr></thead>
    <tbody>${rows.map(x => { run = r2(run + x.inn - x.out); return `<tr><td class="n">${fdate(x.date)}</td><td>${esc(x.label)}</td><td>${esc(x.party)}</td><td class="n pos">${x.inn ? m(x.inn) : ""}</td><td class="n neg">${x.out ? m(x.out) : ""}</td><td class="n"><b>${m(run)}</b></td></tr>`; }).join("")}</tbody></table>` : `<div class="empty">لا حركات في هذه الفترة</div>`}</div>`;
  $("#k-from").onchange = e => { cState.from = e.target.value || today(); route(); };
  $("#k-to").onchange = e => { cState.to = e.target.value || today(); route(); };
}

function frWords(n){
  const u = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const t = ["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const b100 = n => { if (n < 20) return u[n]; const d = Math.floor(n / 10), r = n % 10;
    if (d === 7 || d === 9) return t[d] + (d === 7 && r === 1 ? "-et-" : "-") + u[10 + r];
    if (r === 0) return t[d] + (d === 8 ? "s" : ""); if (r === 1 && d !== 8) return t[d] + "-et-un"; return t[d] + "-" + u[r]; };
  const b1000 = n => { const c = Math.floor(n / 100), r = n % 100; let s = ""; if (c) s = (c > 1 ? u[c] + " " : "") + "cent" + (c > 1 && !r ? "s" : ""); if (r) s += (s ? " " : "") + b100(r); return s; };
  if (!n) return "zéro";
  let s = "", rest = n;
  for (const [v, w] of [[1e9, "milliard"], [1e6, "million"], [1e3, "mille"]]){
    const q = Math.floor(rest / v); if (!q) continue; rest %= v;
    if (w === "mille") s += (q === 1 ? "" : b1000(q).replace(/(cent|vingt)s$/, "$1") + " ") + "mille ";
    else s += b1000(q) + " " + w + (q > 1 ? "s" : "") + " ";
  }
  if (rest) s += b1000(rest);
  return s.trim();
}
function amountWords(x){ const i = Math.floor(r2(x)), c = Math.round((r2(x) - i) * 100); const w = frWords(i) + " dinars" + (c ? " et " + frWords(c) + " centimes" : ""); return w.charAt(0).toUpperCase() + w.slice(1); }

    <tbody>${s.lines.map((l, i) => `<tr>${ticket ? "" : `<td>${i + 1}</td><td>${esc(l.code)}</td>`}<td>${esc(l.name)}</td>${ticket ? "" : `<td class="r">${l.colisage > 1 ? qf(l.qty / l.colisage) : ""}</td>`}<td class="r">${qf(l.qty)}</td><td class="r">${m(l.price)}</td><td class="r">${m(l.qty * l.price)}</td></tr>`).join("")}</tbody></table>
    <div>${L.nb}: ${s.lines.length} — ${L.tq}: ${qf(tq)}</div>
    <table class="tot">
      ${s.remise ? `<tr><td>${L.sub}</td><td class="r">${m(s.sub)}</td></tr><tr><td>${L.remise}</td><td class="r">-${m(s.remise)}</td></tr>` : ""}
      <tr><td><b>${L.net}</b></td><td class="r"><b>${m(s.total)} ${esc(db.settings.currency)}</b></td></tr>
      ${p ? `<tr><td>${L.paid}</td><td class="r">${m(s.paid)}</td></tr><tr><td>${L.rest}</td><td class="r">${m(s.total - s.paid)}</td></tr>
      <tr><td>${L.oldBal}</td><td class="r">${m(oldBal)}</td></tr><tr><td><b>${L.newBal}</b></td><td class="r"><b>${m(newBal)}</b></td></tr>` : ""}
    </table>
    ${lang === "fr" ? `<p>${L.words} : <b>${amountWords(s.total)}</b></p>` : ""}
    ${s.note ? `<p>${esc(s.note)}</p>` : ""}
    ${ticket ? "" : `<div class="sig"><span>${L.sig1}</span><span>${L.sig2}</span></div>`}`;

/* ================= تصدير ================= */
async function download(name, content, type){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl){ try { await dl.save({filename:name, data:new Blob([content], {type})}); return; } catch(e){ if (e && e.code === "declined") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(name, rows){
  const cell = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  download(name, "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}

/* ================= النسخ السحابي (عند الفتح من رابط Claude) ================= */
// تُحفظ البيانات كاملة في حساب المستخدم (مسار خاص لا يراه غيره)، مقسّمة إلى أجزاء.
const cloud = { db:null, base:"", ready:false, remoteAt:0, timer:null, pushing:false, again:false, conflict:false };
const CHUNK = 180000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cloudStatus(t){ const el = $("#save-state"); if (el) el.textContent = t; }
function cloudSchedule(){ if (!cloud.ready || cloud.conflict) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, 2500); }
async function readRemote(){
  const meta = await cloud.db.doc(cloud.base + "meta").get();
  if (!meta.exists) return null;
  const m = meta.data();
  const parts = await Promise.all([...Array(m.n)].map((_, i) => cloud.db.doc(cloud.base + "c" + i).get()));
  if (parts.some(p => !p.exists || p.data().at !== m.at)) return null; // نسخة غير مكتملة
  return { at:m.at, data:JSON.parse(parts.map(p => p.data().s).join("")) };
}
async function cloudPush(){
  if (!cloud.ready || cloud.conflict) return;
  if (cloud.pushing){ cloud.again = true; return; }
  cloud.pushing = true; cloudStatus("☁️ جارٍ الحفظ في حسابك…");
  try {
    const meta = await cloud.db.doc(cloud.base + "meta").get();
    const rAt = meta.exists ? meta.data().at : 0;
    if (rAt && rAt !== cloud.remoteAt){ cloud.conflict = true; showConflict(); return; } // جهاز آخر غيّر البيانات
    const json = JSON.stringify(db), at = Date.now(), n = Math.ceil(json.length / CHUNK) || 1;
    for (let i = 0; i < n; i++) await cloud.db.doc(cloud.base + "c" + i).set({ s:json.slice(i * CHUNK, (i + 1) * CHUNK), at });
    await cloud.db.doc(cloud.base + "meta").set({ n, at, size:json.length });
    const old = meta.exists ? meta.data().n : 0;
    for (let i = n; i < old; i++) cloud.db.doc(cloud.base + "c" + i).delete().catch(() => {});
    cloud.remoteAt = at; try { localStorage.setItem(KEY + ":remoteAt", String(at)); } catch {}
    cloudStatus("☁️ محفوظ في حسابك على Claude");
  } catch(e){
    cloudStatus(e && e.code === "quota_exceeded" ? "⚠ مساحة الحفظ السحابي ممتلئة — احفظ نسخة احتياطية" : "⚠ لم يُرفع للسحابة بعد (سيُعاد المحاولة)");
    if (!(e && (e.code === "quota_exceeded" || e.code === "invalid_argument" || e.code === "revoked"))) setTimeout(cloudSchedule, 15000);
  } finally {
    cloud.pushing = false;
    if (cloud.again){ cloud.again = false; cloudSchedule(); }
  }
}
function adoptRemote(r){ db = normalize(r.data); cloud.remoteAt = r.at; cloudStatus("☁️ محفوظ في حسابك على Claude"); try { localStorage.setItem(KEY, JSON.stringify(db)); localStorage.setItem(KEY + ":remoteAt", String(r.at)); } catch {} route(); }
function showConflict(){
  cloudStatus("⚠ تغييرات من جهاز آخر");
  modal("تم تعديل البيانات من جهاز آخر", `<p>حسابك على Claude فيه نسخة أحدث حفظها جهاز آخر. اختر أي نسخة تريد الاحتفاظ بها:</p>
    <div class="m-foot"><button class="btn primary" id="cf-remote">استعمال نسخة الجهاز الآخر</button><button class="btn danger" id="cf-local">الإبقاء على نسخة هذا الجهاز</button></div>
    <p class="muted">نصيحة: استعمل جهازًا واحدًا في نفس الوقت لتجنّب هذا.</p>`, b => {
    $("#cf-remote", b).onclick = async () => { const r = await readRemote().catch(() => null); closeModal(); cloud.conflict = false; if (r) { adoptRemote(r); toast("✓ تم تحميل نسخة الجهاز الآخر"); } };
    $("#cf-local", b).onclick = async () => { const m = await cloud.db.doc(cloud.base + "meta").get().catch(() => null); cloud.remoteAt = m && m.exists ? m.data().at : 0; cloud.conflict = false; closeModal(); cloudPush(); };
  });
}
async function cloudInit(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [cdb, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!cdb || !user) return;
    const id = await user.id(); if (!id) return;
    cloud.db = cdb; cloud.base = "data/users/" + id + "/dafter_";
    cloudStatus("☁️ جارٍ الاتصال بحسابك…");
    let r = null;
    for (let k = 0; k < 2; k++){ try { r = await Promise.race([readRemote(), sleep(10000).then(() => { throw {code:"timeout"}; })]); break; } catch(e){ if (k || (e && e.code !== "unavailable")) throw e; await sleep(800 + Math.random() * 800); } }
    let lastRemote = 0; try { lastRemote = +localStorage.getItem(KEY + ":remoteAt") || 0; } catch {}
    cloud.ready = true;
    if (!r){ cloud.remoteAt = 0; cloudPush(); }
    else if (r.at === lastRemote){ cloud.remoteAt = r.at; if ((db._rev || 0) > r.at) cloudPush(); else cloudStatus("☁️ محفوظ في حسابك على Claude"); }
    else {
      const localChanged = hadLocal && !db.settings.demo && (db._rev || 0) > lastRemote;
      if (!localChanged){ adoptRemote(r); toast("☁️ تم تحميل بياناتك من حسابك على Claude"); }
      else { cloud.remoteAt = lastRemote; cloud.conflict = true; showConflict(); return; }
    }
    if (curRoute() === "settings" || curRoute() === "dash") route();
  } catch(e){ cloud.ready = false; cloudStatus("✓ محفوظ على هذا الجهاز"); }
}

/* ================= لوحة المفاتيح والبدء ================= */
document.addEventListener("keydown", e => {
  if (dlg.open) return;
  const r = curRoute(), onDoc = r === "sale" || r === "purchase";
  if (e.key === "F1"){ e.preventDefault(); if (r === "sale") newDoc("sale"); else location.hash = "#/sale"; }
  else if (e.key === "F2" && onDoc){ e.preventDefault(); $("#d-code").focus(); }
  else if (e.key === "F3" && onDoc){ e.preventDefault(); commitDoc(r); }
  else if (e.key === "F8" && r === "sale"){ e.preventDefault(); holdDoc(); }
  else if (e.key === "F9" && onDoc){ e.preventDefault(); $("#d-party").focus(); }
});
$("#theme-btn").onclick = () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("dafter:theme", root.dataset.theme); } catch {}
};
try { const th = localStorage.getItem("dafter:theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
if (!storageOk) toast("⚠ المتصفح لا يسمح بالحفظ هنا. افتح الملف في Chrome عادي (ليس وضع التصفح الخفي).", true);
// تسميات الجداول لعرض البطاقات على الهاتف + لوحة أرقام مناسبة
function enhance(root){
  $$("table.tbl:not(.lines)", root).forEach(t => {
    const heads = [...(t.tHead ? t.tHead.rows[0].cells : [])].map(c => c.textContent.trim());
    [...t.tBodies, t.tFoot].filter(Boolean).forEach(sec => [...sec.rows].forEach(r => {
      let col = 0; [...r.cells].forEach(c => { if (!c.hasAttribute("data-l")) c.setAttribute("data-l", c.colSpan > 1 ? "" : (heads[col] || "")); col += c.colSpan; });
    }));
  });
  $$('input[type="number"]', root).forEach(i => { if (!i.inputMode) i.inputMode = "decimal"; });
  $$('input[type="tel"]', root).forEach(i => i.inputMode = "tel");
}
const mo = new MutationObserver(muts => { for (const mu of muts) for (const n of mu.addedNodes) if (n.nodeType === 1) enhance(n.parentNode || n); });
mo.observe(view, {childList:true, subtree:true}); mo.observe($("#m-body"), {childList:true, subtree:true});

// إخفاء الأشرطة السفلية عند ظهور لوحة المفاتيح
if (isTouch){

}

    ${installEvt ? `<button id="mm-install"><span>📲 تثبيت التطبيق على الهاتف</span><span></span></button>` : ""}</div>`, b => {

// تطبيق يعمل بدون إنترنت + حماية البيانات من المسح التلقائي
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
const hadLocal = (() => { try { return !!localStorage.getItem(KEY); } catch { return false; } })();
if (!hadLocal){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} }
route();
enhance(document);
cloudInit();
